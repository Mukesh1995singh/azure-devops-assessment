name: Application CI

on:
  pull_request:
    paths:
      - "app/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"

  push:
    branches:
      - main
    paths:
      - "app/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  test:
    name: Application Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: hotel-booking-api:test