name: Docker Build

on:
  pull_request:
    paths:
      - "app/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"

  push:
    branches:
      - main
    paths:
      - "app/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: hotel-booking-api:test